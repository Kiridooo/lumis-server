<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1035}
body{
  background:linear-gradient(160deg,#1a1035 0%,#0e0b1a 100%) !important;
  font-family:'Segoe UI',Arial,sans-serif;color:#e8e0ff;
  display:flex;flex-direction:column;
}

/* ── Name Setup Screen ── */
.name-screen{
  position:absolute;inset:0;
  background:linear-gradient(160deg,#1a1035,#0e0b1a);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:20px;z-index:50;
}
.name-screen.hidden{display:none}
.ns-title{
  font-family:'Segoe UI',Arial,sans-serif;font-size:22px;font-weight:700;
  background:linear-gradient(90deg,#c084fc,#67e8f9);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;
}
.ns-sub{font-size:11px;color:#6b5f8a;text-align:center;line-height:1.5}
.ns-input{
  width:100%;padding:9px 12px;
  background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.12);
  border-radius:10px;color:#e8e0ff;font-family:'Segoe UI',Arial,sans-serif;font-size:13px;outline:none;
}
.ns-input:focus{border-color:#7B2FBE}
.ns-btn{
  width:100%;padding:10px;background:linear-gradient(135deg,#7B2FBE,#4a1880);
  border:none;border-radius:10px;color:#fff;font-family:'Segoe UI',Arial,sans-serif;
  font-size:13px;font-weight:900;cursor:pointer;letter-spacing:1px;
}
.ns-btn:hover{opacity:0.9}

/* ── Header ── */
.header{
  padding:10px 12px 6px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.header-title{
  font-family:'Segoe UI',Arial,sans-serif;font-size:16px;font-weight:700;
  background:linear-gradient(90deg,#c084fc,#67e8f9);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;
}
.header-user{font-size:10px;color:#6b5f8a;cursor:pointer}
.header-user:hover{color:#a78bfa}

/* ── Spawn Zone ── */
.spawn-zone{
  margin:10px 10px 6px;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);
  border-radius:14px;padding:12px;text-align:center;
  transition:all 0.4s;
}
.spawn-zone.active{
  border-color:var(--ac,#7B2FBE);
  box-shadow:0 0 20px var(--ag,rgba(123,47,190,0.25));
}
.idle-icon{font-size:24px;margin-bottom:4px}
.idle-text{font-size:11px;color:#6b5f8a}
.idle-timer{color:#a78bfa;font-weight:900}
.lumi-row{display:flex;align-items:center;gap:10px}
.lumi-emoji-sm{font-size:42px;line-height:1;animation:bob 1.2s ease-in-out infinite}
.lumi-details{flex:1;text-align:left}
.rarity-badge-sm{font-size:8px;letter-spacing:2px;font-weight:900;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid currentColor;display:inline-block;margin-bottom:3px}
.lumi-name-sm{font-size:15px;font-weight:900}
.lumi-pts{font-size:10px;color:#9d8fc0;margin-top:1px}
.catch-chance-sm{font-size:10px;margin-top:2px}
.progress-wrap{height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;margin-top:6px}
.progress-bar{height:100%;border-radius:2px;transition:width 1s linear}
.catch-btn{
  width:100%;margin-top:8px;padding:9px;border:none;border-radius:10px;
  color:#fff;font-weight:900;font-size:13px;font-family:'Segoe UI',Arial,sans-serif;
  cursor:pointer;letter-spacing:1px;transition:transform 0.1s;
}
.catch-btn:hover{transform:scale(1.02)}
.catch-btn:active{transform:scale(0.97)}
.catch-btn:disabled{cursor:default;transform:none}

/* ── Tabs ── */
.tabs{display:flex;margin:0 10px 6px;gap:4px}
.tab-btn{
  flex:1;padding:5px 2px;background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.06);border-radius:8px;
  color:#5a5070;font-size:9px;font-weight:900;font-family:'Segoe UI',Arial,sans-serif;
  cursor:pointer;letter-spacing:1px;transition:all 0.2s;
}
.tab-btn.active{background:rgba(123,47,190,0.2);border-color:rgba(123,47,190,0.5);color:#d8b4fe}

/* ── Panel ── */
.panel{
  flex:1;margin:0 10px 10px;
  background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);
  border-radius:12px;overflow:hidden;overflow-y:auto;
}
.panel::-webkit-scrollbar{width:3px}
.panel::-webkit-scrollbar-thumb{background:#3a2d5a;border-radius:2px}
.tab-content{display:none;padding:10px}
.tab-content.active{display:block}

/* Chat */
.chat-msg{font-size:10px;line-height:1.6;margin-bottom:1px}
.cu{font-weight:900;margin-right:4px}
.cu-system{color:#a78bfa}.cu-catch{color:#fde68a}.cu-normal{color:#67e8f9}
.ct-system{color:#6b5f8a}.ct-normal{color:#b0a0d0}

/* Collection */
.sec-label{font-size:9px;color:#5a5070;letter-spacing:2px;margin-bottom:8px}
.critter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.critter-card{text-align:center;background:rgba(255,255,255,0.03);border-radius:8px;padding:6px 2px;border:1px solid rgba(255,255,255,0.05)}
.cc-emoji{font-size:20px}
.cc-name{font-size:7px;color:#7a6d9a;margin-top:1px}
.cc-count{font-size:9px;font-weight:900;margin-top:1px}
.empty{text-align:center;color:#3a2d5a;padding:20px 0;font-size:11px}

/* Leaderboard */
.lb-row{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:3px;background:rgba(255,255,255,0.02);border-radius:8px;border:1px solid transparent}
.lb-row.me{background:rgba(123,47,190,0.12);border-color:rgba(123,47,190,0.25)}
.lb-rank{width:18px;font-size:10px;font-weight:900}
.lb-name{flex:1;font-size:10px;color:#9d8fc0}
.lb-name.me{color:#e8e0ff;font-weight:900}
.lb-pts{font-size:10px;color:#fde68a;font-weight:900}

/* Toast */
.toast{
  position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
  padding:7px 14px;border-radius:10px;font-weight:900;font-size:11px;
  pointer-events:none;z-index:100;border:1px solid rgba(255,255,255,0.1);
  animation:toastIn 0.3s ease,toastOut 0.3s ease 2s forwards;white-space:nowrap;
}
@keyframes toastIn{from{opacity:0;bottom:4px}to{opacity:1;bottom:10px}}
@keyframes toastOut{to{opacity:0;bottom:4px}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
</head>
<body>

<!-- Name Setup -->
<div class="name-screen" id="nameScreen">
  <div class="ns-title">✦ LUMIS ✦</div>
  <div class="ns-sub">Gib deinen Twitch-Namen ein um Lumis zu fangen!</div>
  <input class="ns-input" id="nsInput" placeholder="Dein Twitch-Name..." maxlength="32">
  <button class="ns-btn" onclick="saveNameAndStart()">Los geht's! ✨</button>
</div>

<!-- Main UI -->
<div id="mainUI" style="display:none;flex-direction:column;height:100%">

  <div class="header">
    <div class="header-title">✦ LUMIS ✦</div>
    <div class="header-user" id="headerUser" onclick="resetName()">👤 —</div>
  </div>

  <div class="spawn-zone" id="spawnZone">
    <div id="idleState">
      <div class="idle-icon">🌙</div>
      <div class="idle-text">Nächstes Lumi in <span class="idle-timer" id="spawnTimer">...</span>s</div>
    </div>
    <div id="activeState" style="display:none">
      <div class="lumi-row">
        <div class="lumi-emoji-sm" id="lumiEmoji"></div>
        <div class="lumi-details">
          <div class="rarity-badge-sm" id="rarityBadge"></div>
          <div class="lumi-name-sm" id="lumiName"></div>
          <div class="lumi-pts" id="lumiPts"></div>
          <div class="catch-chance-sm" id="catchChance"></div>
        </div>
      </div>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <button class="catch-btn" id="catchBtn" onclick="handleCatch()">✨ !catch — FANGEN!</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('chat',this)">💬 Chat</button>
    <button class="tab-btn" onclick="switchTab('sammlung',this)">🫙 Sammlung</button>
    <button class="tab-btn" onclick="switchTab('top',this)">🏆 Top</button>
  </div>

  <div class="panel">
    <div id="tab-chat" class="tab-content active"><div id="chatLog"></div></div>
    <div id="tab-sammlung" class="tab-content">
      <div class="sec-label" id="collLabel">SAMMLUNG (0/33)</div>
      <div class="empty" id="collEmpty">🫙<br>Noch keine Lumis!</div>
      <div class="critter-grid" id="collGrid" style="display:none"></div>
    </div>
    <div id="tab-top" class="tab-content">
      <div class="sec-label">TOP CATCHER</div>
      <div id="lbList"></div>
    </div>
  </div>

</div>

<script>
const SERVER = "https://lumis-server.onrender.com";
const RC = {common:"#95E1A3",rare:"#7B8FFF",epic:"#00D4FF",legendary:"#FFD700"};
const CL = {common:"70%",rare:"22%",epic:"6%",legendary:"2%"};
const CE = {common:"🟢",rare:"🔵",epic:"💎",legendary:"⭐"};
const LUMIS_DATA = [
  // Common
  {id:"foxlumi",      name:"Fuchsfunken",   emoji:"🦊",  rarity:"common",    color:"#FF6B35"},
  {id:"moonbun",      name:"Mondhase",      emoji:"🐰",  rarity:"common",    color:"#A8D8EA"},
  {id:"glowfrog",     name:"Leuchtkröte",   emoji:"🐸",  rarity:"common",    color:"#95E1A3"},
  {id:"pebblet",      name:"Steingeist",    emoji:"🪨",  rarity:"common",    color:"#B0A090"},
  {id:"schneefloh",   name:"Schneefloh",    emoji:"🐭",  rarity:"common",    color:"#E8F4FD"},
  {id:"windwiesel",   name:"Windwiesel",    emoji:"🦔",  rarity:"common",    color:"#C8B89A"},
  {id:"pilzling",     name:"Pilzling",      emoji:"🍄",  rarity:"common",    color:"#E8A87C"},
  {id:"tauwind",      name:"Tauwind",       emoji:"🐛",  rarity:"common",    color:"#A8E6CF"},
  {id:"kieselkind",   name:"Kieselkind",    emoji:"🐢",  rarity:"common",    color:"#88C999"},
  {id:"nebelkatze",   name:"Nebelkatze",    emoji:"🐱",  rarity:"common",    color:"#BDC3C7"},
  {id:"blattelf",     name:"Blattelf",      emoji:"🌿",  rarity:"common",    color:"#82E0AA"},
  {id:"sandfuchs",    name:"Sandfuchs",     emoji:"🦝",  rarity:"common",    color:"#F0B27A"},
  // Rare
  {id:"stardust",     name:"Sternenstaub",  emoji:"✨",  rarity:"rare",      color:"#FFD700"},
  {id:"crystalpup",   name:"Kristallwolf",  emoji:"🐺",  rarity:"rare",      color:"#B8A9FF"},
  {id:"shadowcat",    name:"Schattenkatze", emoji:"🐈‍⬛", rarity:"rare",    color:"#6C63FF"},
  {id:"froststier",   name:"Froststier",    emoji:"🐂",  rarity:"rare",      color:"#AED6F1"},
  {id:"donnervogel",  name:"Donnervogel",   emoji:"🦅",  rarity:"rare",      color:"#F7DC6F"},
  {id:"tiefseequal",  name:"Tiefseequalle", emoji:"🪼",  rarity:"rare",      color:"#76D7C4"},
  {id:"blitzmarder",  name:"Blitzmarder",   emoji:"⚡",  rarity:"rare",      color:"#F9E79F"},
  {id:"nachtfalter",  name:"Nachtfalter",   emoji:"🦇",  rarity:"rare",      color:"#9B59B6"},
  {id:"eisblume",     name:"Eisblume",      emoji:"❄️",  rarity:"rare",      color:"#AED6F1"},
  {id:"glutspinne",   name:"Glutspinne",    emoji:"🕷️",  rarity:"rare",      color:"#E74C3C"},
  // Epic
  {id:"cosmicjelly",  name:"Weltenjelly",   emoji:"🪼",  rarity:"epic",      color:"#00D4FF"},
  {id:"veilwing",     name:"Schleierfee",   emoji:"🦋",  rarity:"epic",      color:"#FF69B4"},
  {id:"nebeldrache",  name:"Nebeldrache",   emoji:"🌫️",  rarity:"epic",      color:"#85C1E9"},
  {id:"geisterluchs", name:"Geisterluchs",  emoji:"🐆",  rarity:"epic",      color:"#A569BD"},
  {id:"sternenwal",   name:"Sternenwal",    emoji:"🐋",  rarity:"epic",      color:"#5DADE2"},
  {id:"zeitfuchs",    name:"Zeitfuchs",     emoji:"🦊",  rarity:"epic",      color:"#F0E68C"},
  // Legendary
  {id:"moondragon",   name:"Monddrache",    emoji:"🐉",  rarity:"legendary", color:"#7B2FBE"},
  {id:"phoenix",      name:"Phönix",        emoji:"🔥",  rarity:"legendary", color:"#FF4444"},
  {id:"sternenkoenig",name:"Sternenkönig",  emoji:"👑",  rarity:"legendary", color:"#FFD700"},
  {id:"abyssgeist",   name:"Abyssgeist",    emoji:"👻",  rarity:"legendary", color:"#2C3E50"},
  {id:"ewigkeitsbaer",name:"Ewigkeitsbär",  emoji:"🐻",  rarity:"legendary", color:"#E8DAEF"},
];

let username = localStorage.getItem("lumis_name") || "";
let currentLumi = null, catchOpen = false, countdown = 0, countdownInterval = null;
let myCollection = {};

// Init
if (username) startMain();
else document.getElementById("nameScreen").classList.remove("hidden");

function saveNameAndStart() {
  const v = document.getElementById("nsInput").value.trim();
  if (!v) return;
  username = v;
  localStorage.setItem("lumis_name", username);
  startMain();
}

function startMain() {
  document.getElementById("nameScreen").classList.add("hidden");
  const main = document.getElementById("mainUI");
  main.style.display = "flex";
  document.getElementById("headerUser").textContent = "👤 " + username;
  fetchPlayerData();
  fetchState();
  setInterval(fetchState, 3000);
  addChat("✨ System", "Lumis ist live!", "system");
}

function resetName() {
  localStorage.removeItem("lumis_name");
  location.reload();
}

async function fetchState() {
  try {
    const data = await (await fetch(SERVER + "/api/state")).json();
    if (data.leaderboard) renderLeaderboard(data.leaderboard);
    if (data.catchOpen && data.lumi) {
      if (!catchOpen || !currentLumi || currentLumi.id !== data.lumi.id) {
        currentLumi = data.lumi; catchOpen = true; countdown = 20;
        showActiveLumi(data.lumi);
        addChat("✨ System", `${data.lumi.emoji} ${data.lumi.name} erscheint! [${data.lumi.rarity.toUpperCase()}]`, "system");
      }
    } else if (!data.catchOpen && catchOpen) {
      catchOpen = false; currentLumi = null; showIdle(data.nextSpawnIn);
    } else if (!data.catchOpen) {
      document.getElementById("spawnTimer").textContent = data.nextSpawnIn || "...";
    }
  } catch {}
}

async function fetchPlayerData() {
  if (!username) return;
  try {
    const data = await (await fetch(`${SERVER}/api/player/${encodeURIComponent(username)}`)).json();
    myCollection = data.collection || {};
    renderCollection();
  } catch {}
}

function showActiveLumi(lumi) {
  const zone = document.getElementById("spawnZone");
  const rc = RC[lumi.rarity];
  zone.style.setProperty("--ac", rc);
  zone.style.setProperty("--ag", rc + "44");
  zone.classList.add("active");
  document.getElementById("idleState").style.display = "none";
  document.getElementById("activeState").style.display = "block";
  document.getElementById("rarityBadge").textContent = lumi.rarity.toUpperCase();
  document.getElementById("rarityBadge").style.color = rc;
  document.getElementById("lumiEmoji").textContent = lumi.emoji;
  document.getElementById("lumiEmoji").style.filter = `drop-shadow(0 0 12px ${lumi.color})`;
  document.getElementById("lumiName").textContent = lumi.name;
  document.getElementById("lumiName").style.color = lumi.color;
  document.getElementById("lumiPts").textContent = `+${lumi.points} Punkte`;
  document.getElementById("catchChance").innerHTML = `${CE[lumi.rarity]} Fangchance: <strong style="color:${rc}">${CL[lumi.rarity]}</strong>`;
  const btn = document.getElementById("catchBtn");
  btn.style.background = `linear-gradient(135deg,${lumi.color},${rc})`;
  btn.style.boxShadow = `0 3px 16px ${lumi.color}44`;
  btn.style.opacity = "1"; btn.disabled = false; btn.textContent = "✨ !catch — FANGEN!";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("progressBar").style.background = rc;
  clearInterval(countdownInterval);
  countdownInterval = setInterval(() => {
    countdown--;
    document.getElementById("progressBar").style.width = `${(countdown/20)*100}%`;
    if (countdown <= 0) { clearInterval(countdownInterval); if(catchOpen){catchOpen=false;currentLumi=null;showIdle();addChat("✨ System","Das Lumi ist entkommen...","system");} }
  }, 1000);
}

function showIdle(timer) {
  clearInterval(countdownInterval);
  const zone = document.getElementById("spawnZone");
  zone.classList.remove("active");
  document.getElementById("idleState").style.display = "block";
  document.getElementById("activeState").style.display = "none";
  if (timer !== undefined) document.getElementById("spawnTimer").textContent = timer;
}

async function handleCatch() {
  if (!catchOpen || !currentLumi) return;
  const btn = document.getElementById("catchBtn");
  btn.disabled = true; btn.textContent = "🎲 Würfeln...";
  try {
    const data = await (await fetch(SERVER + "/api/catch", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({username})
    })).json();
    if (data.success) {
      const l = data.lumi;
      showToast(`🎉 ${l.emoji} ${l.name} gefangen! +${l.points} pts!`, "#86efac");
      addChat(username, `hat ${l.emoji} ${l.name} gefangen! +${l.points} pts 🎉`, "catch");
      myCollection[l.id] = (myCollection[l.id]||0)+1;
      renderCollection(); clearInterval(countdownInterval);
      catchOpen = false; currentLumi = null; showIdle();
    } else if (data.reason==="already_tried") {
      btn.disabled=true; btn.textContent="✋ Bereits versucht";
      btn.style.background="rgba(255,255,255,0.05)"; btn.style.boxShadow="none";
      showToast("Nur 1 Versuch pro Lumi!","#FF9944");
    } else if (data.reason==="no_lumi") {
      btn.disabled=false; btn.textContent="✨ !catch — FANGEN!";
      showToast("Zu langsam! 😢","#FF6B6B");
    } else {
      btn.disabled=true; btn.textContent="❌ Entkommen...";
      btn.style.background="rgba(255,80,80,0.1)"; btn.style.boxShadow="none";
      addChat(username, `!catch — Entkommen (${data.roll}% > ${data.needed}%)`, "normal");
      showToast(`❌ Entkommen! (${data.roll}% > ${data.needed}%)`, "#FF6B6B");
    }
  } catch { btn.disabled=false; btn.textContent="✨ !catch — FANGEN!"; }
}

function renderCollection() {
  const owned = LUMIS_DATA.filter(l => myCollection[l.id]);
  document.getElementById("collLabel").textContent = `SAMMLUNG (${owned.length}/33)`;
  if (!owned.length) { document.getElementById("collEmpty").style.display="block"; document.getElementById("collGrid").style.display="none"; return; }
  document.getElementById("collEmpty").style.display="none";
  const grid = document.getElementById("collGrid"); grid.style.display="grid";
  grid.innerHTML = owned.map(l=>`<div class="critter-card" style="border-color:${RC[l.rarity]}33"><div class="cc-emoji">${l.emoji}</div><div class="cc-name">${l.name}</div><div class="cc-count" style="color:${RC[l.rarity]}">×${myCollection[l.id]}</div></div>`).join("");
}

function renderLeaderboard(lb) {
  const rankColors=["#FFD700","#C0C0C0","#CD7F32"];
  document.getElementById("lbList").innerHTML = (!lb||!lb.length)
    ? `<div class="empty">Noch keine Daten</div>`
    : lb.map((p,i)=>`<div class="lb-row ${p.username===username?'me':''}"><div class="lb-rank" style="color:${rankColors[i]||'#3a2d5a'}">#${i+1}</div><div class="lb-name ${p.username===username?'me':''}">${p.username}</div><div class="lb-pts">${p.points} pts</div></div>`).join("");
}

function switchTab(name, btn) {
  document.querySelectorAll(".tab-content").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("tab-"+name).classList.add("active"); btn.classList.add("active");
  if(name==="sammlung") fetchPlayerData();
}

function addChat(user, msg, type="normal") {
  const log = document.getElementById("chatLog");
  const div = document.createElement("div"); div.className="chat-msg";
  div.innerHTML=`<span class="cu cu-${type}">${user}</span><span class="ct-${type==='catch'?'normal':type}">${msg}</span>`;
  log.appendChild(div); while(log.children.length>30)log.removeChild(log.firstChild); log.scrollTop=log.scrollHeight;
}

function showToast(msg, color="#86efac") {
  const old=document.querySelector(".toast"); if(old)old.remove();
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  t.style.background=color+"22"; t.style.color=color; t.style.borderColor=color+"44";
  document.body.appendChild(t); setTimeout(()=>t.remove(),2400);
}
</script>
</body>
</html>
