<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Lumis</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Rajdhani:wght@700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:radial-gradient(ellipse at top,#1a1035 0%,#0e0b1a 60%);
  font-family:'Nunito',sans-serif;color:#e8e0ff;
  display:flex;flex-direction:column;align-items:center;padding:16px;gap:14px;
}
.header{text-align:center}
.title{
  font-family:'Rajdhani',sans-serif;font-size:30px;font-weight:700;
  background:linear-gradient(90deg,#c084fc,#67e8f9,#fde68a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;
}
.subtitle{font-size:10px;color:#6b5f8a;letter-spacing:4px;margin-top:1px}
.name-row{display:flex;gap:8px;width:100%;max-width:400px}
.name-input{
  flex:1;padding:9px 14px;background:rgba(255,255,255,0.05);
  border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;
  color:#e8e0ff;font-family:'Nunito',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s;
}
.name-input:focus{border-color:#7B2FBE}
.name-input::placeholder{color:#4a4060}
.name-save{
  padding:9px 16px;background:rgba(123,47,190,0.4);border:1.5px solid #7B2FBE;
  border-radius:10px;color:#e8e0ff;font-family:'Nunito',sans-serif;font-size:13px;
  font-weight:700;cursor:pointer;transition:background 0.2s;white-space:nowrap;
}
.name-save:hover{background:rgba(123,47,190,0.6)}
.spawn-zone{
  width:100%;max-width:400px;
  background:linear-gradient(135deg,rgba(123,47,190,0.08),rgba(0,212,255,0.05));
  border:1.5px solid rgba(255,255,255,0.08);border-radius:20px;padding:22px 16px;
  text-align:center;position:relative;min-height:180px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:all 0.4s;
}
.spawn-zone.active{border-color:var(--ac,#7B2FBE);box-shadow:0 0 40px var(--ag,rgba(123,47,190,0.3))}
.rarity-badge{font-size:10px;letter-spacing:3px;font-weight:900;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,0.06);border:1px solid currentColor}
.lumi-emoji{font-size:68px;line-height:1;animation:bob 1.2s ease-in-out infinite}
.lumi-name{font-size:22px;font-weight:900;letter-spacing:1px}
.lumi-info{font-size:11px;color:#9d8fc0}
.catch-chance{font-size:11px}
.progress-wrap{width:180px;height:5px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;border-radius:3px;transition:width 1s linear}
.catch-btn{
  padding:11px 28px;border:none;border-radius:12px;color:#fff;
  font-weight:900;font-size:14px;font-family:'Nunito',sans-serif;
  cursor:pointer;letter-spacing:1px;transition:transform 0.1s;
}
.catch-btn:hover{transform:scale(1.04)}
.catch-btn:active{transform:scale(0.96)}
.catch-btn:disabled{cursor:default;transform:none}
.idle-icon{font-size:36px;margin-bottom:6px}
.idle-text{font-size:13px;color:#6b5f8a}
.idle-timer{color:#a78bfa;font-weight:900}
.catch-effect{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:18px;font-size:60px;pointer-events:none;z-index:10;animation:celebrate 0.6s ease-out forwards}
@keyframes celebrate{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
.tabs{display:flex;gap:6px;width:100%;max-width:400px}
.tab-btn{
  flex:1;padding:8px 4px;background:rgba(255,255,255,0.03);border:1.5px solid rgba(255,255,255,0.07);
  border-radius:10px;color:#5a5070;font-weight:900;font-size:11px;font-family:'Nunito',sans-serif;
  cursor:pointer;letter-spacing:1px;text-transform:uppercase;transition:all 0.2s;
}
.tab-btn.active{background:rgba(123,47,190,0.25);border-color:rgba(123,47,190,0.6);color:#d8b4fe}
.panel{width:100%;max-width:400px;background:rgba(255,255,255,0.025);border:1.5px solid rgba(255,255,255,0.07);border-radius:16px;overflow:hidden;min-height:230px}
.tab-content{display:none}
.tab-content.active{display:block}
.chat-log{height:260px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:3px}
.chat-log::-webkit-scrollbar{width:3px}
.chat-log::-webkit-scrollbar-thumb{background:#3a2d5a;border-radius:2px}
.chat-msg{font-size:12px;line-height:1.6}
.cu{font-weight:900;margin-right:5px}
.cu-system{color:#a78bfa}.cu-catch{color:#fde68a}.cu-normal{color:#67e8f9}
.ct-system{color:#6b5f8a}.ct-normal{color:#b0a0d0}
.coll-panel,.lb-panel{padding:14px}
.sec-label{font-size:10px;color:#5a5070;margin-bottom:10px;letter-spacing:2px}
.empty{text-align:center;color:#3a2d5a;padding:28px 0}
.critter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.critter-card{text-align:center;background:rgba(255,255,255,0.03);border-radius:12px;padding:10px 4px;border:1px solid rgba(255,255,255,0.05);transition:transform 0.2s}
.critter-card:hover{transform:scale(1.05)}
.cc-emoji{font-size:26px}
.cc-name{font-size:8px;color:#7a6d9a;margin-top:2px}
.cc-count{font-size:10px;font-weight:900;margin-top:1px}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:4px;background:rgba(255,255,255,0.02);border-radius:10px;border:1px solid transparent}
.lb-row.me{background:rgba(123,47,190,0.15);border-color:rgba(123,47,190,0.3)}
.lb-rank{width:22px;font-size:12px;font-weight:900}
.lb-name{flex:1;font-size:12px;color:#9d8fc0}
.lb-name.me{color:#e8e0ff;font-weight:900}
.lb-pts{font-size:12px;color:#fde68a;font-weight:900}
.footer{font-size:9px;color:#2a2040;letter-spacing:2px;text-align:center}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:12px;font-weight:900;font-size:13px;pointer-events:none;z-index:200;border:1.5px solid rgba(255,255,255,0.1);animation:toastIn 0.3s ease,toastOut 0.3s ease 2.2s forwards}
@keyframes toastIn{from{opacity:0;top:10px}to{opacity:1;top:20px}}
@keyframes toastOut{to{opacity:0;top:10px}}

/* ── Spin Wheel ── */
.wheel-overlay{
  position:absolute;inset:0;border-radius:18px;
  background:rgba(10,8,20,0.96);backdrop-filter:blur(8px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  z-index:20;opacity:0;pointer-events:none;transition:opacity 0.2s;
}
.wheel-overlay.visible{opacity:1;pointer-events:all}
.wheel-wrap{position:relative;width:160px;height:160px}
.wheel-canvas{border-radius:50%;box-shadow:0 0 30px rgba(123,47,190,0.4)}
.wheel-pointer{
  position:absolute;top:-12px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:10px solid transparent;
  border-right:10px solid transparent;
  border-top:20px solid #FFD700;
  filter:drop-shadow(0 2px 4px rgba(255,215,0,0.6));
}
.wheel-result{
  font-size:18px;font-weight:900;letter-spacing:1px;
  opacity:0;transform:scale(0.8);transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
  text-align:center;
}
.wheel-result.show{opacity:1;transform:scale(1)}
.wheel-result.success{color:#86efac}
.wheel-result.fail{color:#FF6B6B}


/* ── Errungenschaften ── */
.ach-panel{padding:14px;display:flex;flex-direction:column;gap:8px}
.ach-card{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:12px;
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.06);
  transition:all 0.3s;
}
.ach-card.unlocked{
  background:linear-gradient(135deg,rgba(255,215,0,0.08),rgba(123,47,190,0.08));
  border-color:rgba(255,215,0,0.3);
  box-shadow:0 0 12px rgba(255,215,0,0.1);
}
.ach-card.locked{opacity:0.45;filter:grayscale(0.6)}
.ach-icon{font-size:28px;min-width:36px;text-align:center}
.ach-info{flex:1}
.ach-name{font-size:13px;font-weight:900;color:#e8e0ff}
.ach-desc{font-size:10px;color:#7a6d9a;margin-top:1px}
.ach-badge{
  font-size:9px;font-weight:900;letter-spacing:1px;
  padding:3px 8px;border-radius:10px;white-space:nowrap;
}
.ach-badge.gold{background:rgba(255,215,0,0.15);color:#FFD700;border:1px solid rgba(255,215,0,0.3)}
.ach-badge.locked{background:rgba(255,255,255,0.05);color:#5a5070;border:1px solid rgba(255,255,255,0.08)}
.ach-progress{font-size:9px;color:#6b5f8a;margin-top:2px}

.star{position:fixed;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0;pointer-events:none;animation:twinkle var(--d,3s) var(--delay,0s) infinite}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:0.5}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<div id="bgStars"></div>
<div class="header">
  <div class="title">✦ L U M I S ✦</div>
  <div class="subtitle">TWITCH COLLECTOR</div>
</div>
<div class="name-row">
  <input class="name-input" id="nameInput" placeholder="Dein Twitch-Name..." maxlength="32">
  <button class="name-save" onclick="saveName()">✓ Speichern</button>
</div>
<div class="spawn-zone" id="spawnZone">
  <div id="idleState">
    <div class="idle-icon">🌙</div>
    <div class="idle-text">Nächstes Lumi in <span class="idle-timer" id="spawnTimer">...</span>s</div>
    <div style="font-size:10px;color:#3a2d5a;margin-top:4px">Tippe !catch wenn ein Lumi erscheint</div>
  </div>
  <div id="activeState" style="display:none;flex-direction:column;align-items:center;gap:10px">
    <div class="rarity-badge" id="rarityBadge"></div>
    <div class="lumi-emoji" id="lumiEmoji"></div>
    <div class="lumi-name" id="lumiName"></div>
    <div class="lumi-info" id="lumiInfo"></div>
    <div class="catch-chance" id="catchChance"></div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <button class="catch-btn" id="catchBtn" onclick="handleCatch()">✨ !catch — FANGEN!</button>
  </div>

  <!-- Spin Wheel Popup -->
  <div class="wheel-overlay" id="wheelOverlay">
    <div class="wheel-wrap">
      <canvas class="wheel-canvas" id="wheelCanvas" width="160" height="160"></canvas>
      <div class="wheel-pointer"></div>
    </div>
    <div class="wheel-result" id="wheelResult"></div>
  </div>
</div>
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('live',this)">💬 Chat</button>
  <button class="tab-btn" onclick="switchTab('sammlung',this)">🫙 Sammlung</button>
  <button class="tab-btn" onclick="switchTab('rangliste',this)">🏆 Top</button>
  <button class="tab-btn" onclick="switchTab('errungenschaften',this)">🏅 Ziele</button>
</div>
<div class="panel">
  <div id="tab-live" class="tab-content active"><div class="chat-log" id="chatLog"></div></div>
  <div id="tab-sammlung" class="tab-content">
    <div class="coll-panel">
      <div class="sec-label" id="collLabel">DEINE SAMMLUNG (0/11)</div>
      <div class="empty" id="collEmpty"><div style="font-size:28px">🫙</div><div style="margin-top:6px;font-size:12px">Noch keine Lumis gefangen!</div></div>
      <div class="critter-grid" id="collGrid" style="display:none"></div>
    </div>
  </div>
  <div id="tab-errungenschaften" class="tab-content">
    <div class="ach-panel" id="achList"></div>
  </div>
  <div id="tab-rangliste" class="tab-content">
    <div class="lb-panel">
      <div class="sec-label">TOP CATCHER</div>
      <div id="lbList"></div>
    </div>
  </div>
</div>
<div class="footer">LUMIS • COMMON › RARE › EPIC › LEGENDARY</div>
<div style="font-size:9px;color:#2a2040;letter-spacing:1px;margin-top:-8px">made by <span style="color:#7B2FBE;font-weight:900">Kiridooo</span></div>

<script>
const RC = {common:"#95E1A3",rare:"#7B8FFF",epic:"#00D4FF",legendary:"#FFD700"};
const CL = {common:"70%",rare:"22%",epic:"6%",legendary:"2%"};
const CE = {common:"🟢",rare:"🔵",epic:"💎",legendary:"⭐"};
const LUMIS_DATA = [
  {id:"foxlumi",name:"Foxlumi",emoji:"🦊",rarity:"common",color:"#FF6B35"},
  {id:"moonbun",name:"Moonbun",emoji:"🐰",rarity:"common",color:"#A8D8EA"},
  {id:"glowfrog",name:"Glowfrog",emoji:"🐸",rarity:"common",color:"#95E1A3"},
  {id:"pebblet",name:"Pebblet",emoji:"🪨",rarity:"common",color:"#B0A090"},
  {id:"stardust",name:"Stardust",emoji:"✨",rarity:"rare",color:"#FFD700"},
  {id:"crystalpup",name:"Crystalpup",emoji:"🐺",rarity:"rare",color:"#B8A9FF"},
  {id:"shadowcat",name:"Shadowcat",emoji:"🐈‍⬛",rarity:"rare",color:"#6C63FF"},
  {id:"cosmicjelly",name:"Cosmicjelly",emoji:"🪼",rarity:"epic",color:"#00D4FF"},
  {id:"veilwing",name:"Veilwing",emoji:"🦋",rarity:"epic",color:"#FF69B4"},
  {id:"moondragon",name:"Moondragon",emoji:"🐉",rarity:"legendary",color:"#7B2FBE"},
  {id:"phoenix",name:"Phoenix",emoji:"🔥",rarity:"legendary",color:"#FF4444"},
];

let username = localStorage.getItem("lumis_name") || "";
let currentLumi = null, catchOpen = false, countdown = 0, countdownInterval = null;
let myCollection = {}, myPoints = 0;

createStars();
if (username) document.getElementById("nameInput").value = username;
addChat("✨ System","Lumis ist live! Warte auf das nächste Lumi...","system");
if (username) fetchPlayerData();
fetchState();
setInterval(fetchState, 3000);

function saveName() {
  const v = document.getElementById("nameInput").value.trim();
  if (!v) return showToast("Bitte einen Namen eingeben!","#FF4444");
  username = v;
  localStorage.setItem("lumis_name", username);
  showToast("✅ Gespeichert: " + username,"#86efac");
  fetchPlayerData();
}

async function fetchState() {
  try {
    const data = await (await fetch("/api/state")).json();
    if (data.leaderboard) renderLeaderboard(data.leaderboard);
    if (data.catchOpen && data.lumi) {
      if (!catchOpen || !currentLumi || currentLumi.id !== data.lumi.id) {
        currentLumi = data.lumi; catchOpen = true; countdown = 20;
        showActiveLumi(data.lumi);
        addChat("✨ System",`Ein wildes ${data.lumi.emoji} ${data.lumi.name} erscheint! [${data.lumi.rarity.toUpperCase()}] Fangchance: ${CL[data.lumi.rarity]}`,"system");
      }
    } else if (!data.catchOpen && catchOpen) {
      catchOpen = false; currentLumi = null; showIdle(data.nextSpawnIn);
    } else if (!data.catchOpen) {
      document.getElementById("spawnTimer").textContent = data.nextSpawnIn || "...";
    }
  } catch {}
}

async function fetchPlayerData() {
  if (!username) return;
  try {
    const data = await (await fetch(`/api/player/${encodeURIComponent(username)}`)).json();
    myCollection = data.collection || {}; myPoints = data.points || 0;
    renderCollection();
    renderAchievements();
  } catch {}
}

function showActiveLumi(lumi) {
  const zone = document.getElementById("spawnZone");
  const rc = RC[lumi.rarity];
  zone.style.setProperty("--ac", rc);
  zone.style.setProperty("--ag", rc+"44");
  zone.classList.add("active");
  document.getElementById("idleState").style.display = "none";
  document.getElementById("activeState").style.display = "flex";
  document.getElementById("rarityBadge").textContent = lumi.rarity.toUpperCase();
  document.getElementById("rarityBadge").style.color = rc;
  document.getElementById("lumiEmoji").textContent = lumi.emoji;
  document.getElementById("lumiEmoji").style.filter = `drop-shadow(0 0 20px ${lumi.color})`;
  document.getElementById("lumiName").textContent = lumi.name;
  document.getElementById("lumiName").style.color = lumi.color;
  document.getElementById("lumiInfo").textContent = `+${lumi.points} Punkte • 20s`;
  document.getElementById("catchChance").innerHTML = `${CE[lumi.rarity]} Fangchance: <strong style="color:${rc}">${CL[lumi.rarity]}</strong>`;
  const btn = document.getElementById("catchBtn");
  btn.style.background = `linear-gradient(135deg,${lumi.color},${rc})`;
  btn.style.boxShadow = `0 4px 24px ${lumi.color}55`;
  btn.style.opacity = "1"; btn.disabled = false; btn.textContent = "✨ !catch — FANGEN!";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("progressBar").style.background = rc;
  clearInterval(countdownInterval);
  countdownInterval = setInterval(() => {
    countdown--;
    document.getElementById("progressBar").style.width = `${(countdown/20)*100}%`;
    document.getElementById("lumiInfo").textContent = `+${currentLumi?.points} Punkte • ${countdown}s`;
    if (countdown <= 0) { clearInterval(countdownInterval); if(catchOpen){catchOpen=false;currentLumi=null;showIdle();addChat("✨ System","Das Lumi ist entkommen... 😢","system");} }
  }, 1000);
}

function showIdle(timer) {
  clearInterval(countdownInterval);
  const zone = document.getElementById("spawnZone");
  zone.classList.remove("active");
  document.getElementById("idleState").style.display = "block";
  document.getElementById("activeState").style.display = "none";
  if (timer !== undefined) document.getElementById("spawnTimer").textContent = timer;
}

async function handleCatch() {
  if (!catchOpen || !currentLumi) return;
  if (!username) return showToast("Bitte zuerst Namen eingeben!","#FFD700");
  const btn = document.getElementById("catchBtn");
  btn.disabled = true; btn.textContent = "🎲 Würfeln...";
  try {
    const data = await (await fetch("/api/catch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username})})).json();
    if (data.reason === "already_tried") {
      btn.disabled=true; btn.textContent="✋ Bereits versucht";
      btn.style.background="rgba(255,255,255,0.06)"; btn.style.boxShadow="none";
      showToast("Nur 1 Versuch pro Lumi! 🎲","#FF9944");
      return;
    }
    if (data.reason === "no_lumi") {
      btn.disabled=false; btn.textContent="✨ !catch — FANGEN!";
      showToast("Zu langsam! 😢","#FF6B6B");
      return;
    }
    // Show wheel animation
    spinWheel(data.success, data.needed, data.roll, () => {
      if (data.success) {
        const l = data.lumi;
        showToast(`🎉 ${l.emoji} ${l.name} gefangen! +${l.points} pts!`,"#86efac");
        addChat(username,`hat ${l.emoji} ${l.name} gefangen! +${l.points} pts 🎉`,"catch");
        myCollection[l.id] = (myCollection[l.id]||0)+1; myPoints += l.points;
        renderCollection(); clearInterval(countdownInterval);
        catchOpen = false; currentLumi = null;
        const zone = document.getElementById("spawnZone");
        const fx = document.createElement("div"); fx.className="catch-effect"; fx.textContent="🎉";
        fx.style.background=RC[l.rarity]+"22"; zone.appendChild(fx);
        setTimeout(()=>{if(zone.contains(fx))zone.removeChild(fx);},700);
        showIdle();
      } else {
        btn.disabled=true; btn.textContent="❌ Entkommen...";
        btn.style.background="rgba(255,80,80,0.12)"; btn.style.boxShadow="none";
        addChat(username,`!catch — Lumi entkommen (${data.roll}% > ${data.needed}%)`,"normal");
      }
    });
  } catch { btn.disabled=false; btn.textContent="✨ !catch — FANGEN!"; }
}

// ── Spin Wheel ──
function spinWheel(success, neededPct, rollPct, onDone) {
  const overlay = document.getElementById("wheelOverlay");
  const canvas = document.getElementById("wheelCanvas");
  const result = document.getElementById("wheelResult");
  const ctx = canvas.getContext("2d");
  const cx = 80, cy = 80, r = 75;
  result.className = "wheel-result";
  result.textContent = "";
  overlay.classList.add("visible");

  // Wheel segments: green = catch zone, red = miss zone
  const catchAngle = (neededPct / 100) * Math.PI * 2;
  const missAngle = Math.PI * 2 - catchAngle;

  // Where the pointer lands (top = 0, clockwise)
  // success = land in green, fail = land in red
  const greenStart = -Math.PI / 2; // pointer at top
  // target angle: if success, land in middle of green; if fail, land in middle of red
  const targetOffset = success
    ? catchAngle * 0.5  // land in middle of green = gefangen
    : catchAngle + missAngle * 0.5; // land in middle of red = entkommen

  // Spin: multiple full rotations + target
  const totalRotation = Math.PI * 2 * 6 + targetOffset; // 6 full spins
  const duration = 2000;
  let start = null;

  function drawWheel(rotation) {
    ctx.clearRect(0, 0, 160, 160);
    // Catch segment (green) — starts at pointer position
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, greenStart + rotation, greenStart + catchAngle + rotation);
    ctx.closePath();
    ctx.fillStyle = "#86efac";
    ctx.fill();
    // Miss segment (red) — rest of wheel
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, greenStart + catchAngle + rotation, greenStart + Math.PI*2 + rotation);
    ctx.closePath();
    ctx.fillStyle = "#FF4444";
    ctx.fill();
    // Divider lines
    ctx.strokeStyle = "rgba(10,8,20,0.8)";
    ctx.lineWidth = 3;
    [greenStart + rotation, greenStart + catchAngle + rotation].forEach(angle => {
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angle)*r, cy + Math.sin(angle)*r);
      ctx.stroke();
    });
    // Center circle
    ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI*2);
    ctx.fillStyle = "#0e0b1a"; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 2; ctx.stroke();
    // Labels
    ctx.font = "bold 11px Nunito"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    // Green label
    const gMid = greenStart + rotation + catchAngle/2;
    const gDist = catchAngle > 0.5 ? 45 : 52;
    ctx.fillStyle = "#0e0b1a";
    ctx.fillText("✓", cx + Math.cos(gMid)*gDist, cy + Math.sin(gMid)*gDist);
    // Red label
    const rMid = greenStart + catchAngle + rotation + missAngle/2;
    ctx.fillText("✗", cx + Math.cos(rMid)*50, cy + Math.sin(rMid)*50);
  }

  function easeOut(t) { return 1 - Math.pow(1-t, 4); }

  function animate(ts) {
    if (!start) start = ts;
    const elapsed = ts - start;
    const progress = Math.min(elapsed / duration, 1);
    const rotation = easeOut(progress) * totalRotation;
    drawWheel(rotation);
    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      // Show result
      setTimeout(() => {
        result.textContent = success ? "🎉 GEFANGEN!" : "❌ Entkommen...";
        result.className = `wheel-result show ${success ? 'success' : 'fail'}`;
        setTimeout(() => {
          overlay.classList.remove("visible");
          result.className = "wheel-result";
          onDone();
        }, 900);
      }, 200);
    }
  }

  drawWheel(0);
  requestAnimationFrame(animate);
}

function showToast(msg,color="#86efac") {

  t.style.background=color+"22"; t.style.color=color; t.style.borderColor=color+"44";

function getStats(collection) {
  const lumisData = {
    foxlumi:"common",moonbun:"common",glowfrog:"common",pebblet:"common",
    stardust:"rare",crystalpup:"rare",shadowcat:"rare",
    cosmicjelly:"epic",veilwing:"epic",
    moondragon:"legendary",phoenix:"legendary"
  };
  let total=0, unique=0, rare=0, epic=0, legendary=0;
  for (const [id, count] of Object.entries(collection)) {
    if (count > 0) {
      total += count;
      unique++;
      const rarity = lumisData[id];
      if (rarity === "rare") rare += count;
      if (rarity === "epic") epic += count;
      if (rarity === "legendary") legendary += count;
    }
  }
  return { total, unique, rare, epic, legendary };
}

function getProgress(ach, collection, stats) {
  switch(ach.type) {
    case "total":     { const n = parseInt(ach.id.replace("catch","")); return `${Math.min(stats.total,n)} / ${n}`; }
    case "unique":    { const n = parseInt(ach.id.replace("collect","")||11); return `${Math.min(stats.unique,n)} / ${n}`; }
    case "rare":      return `${Math.min(stats.rare,1)} / 1`;
    case "epic":      return `${Math.min(stats.epic,1)} / 1`;
    case "legendary": { const n = ach.id==="legendary3"?3:1; return `${Math.min(stats.legendary,n)} / ${n}`; }
    case "specific":  { const id=ach.id==="moondragon"?"moondragon":"phoenix"; return `${Math.min(collection[id]||0,1)} / 1`; }
    default: return "";
  }
}

function renderAchievements() {
  const stats = getStats(myCollection);
  const list = document.getElementById("achList");
  if (!list) return;

  const unlocked = ACHIEVEMENTS.filter(a => a.req(myCollection, stats));
  const locked   = ACHIEVEMENTS.filter(a => !a.req(myCollection, stats));

  list.innerHTML = "";

  if (unlocked.length === 0 && locked.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:#3a2d5a;padding:28px 0;font-size:12px">Noch keine Daten — Namen eingeben!</div>';
    return;
  }

  // Header
  if (unlocked.length > 0) {
    const hdr = document.createElement("div");
    hdr.style.cssText = "font-size:10px;color:#FFD700;letter-spacing:2px;font-weight:900;margin-bottom:4px";
    hdr.textContent = `FREIGESCHALTET (${unlocked.length}/${ACHIEVEMENTS.length})`;
    list.appendChild(hdr);
  }

  [...unlocked, ...locked].forEach(ach => {
    const isUnlocked = ach.req(myCollection, stats);
    const progress = getProgress(ach, myCollection, stats);
    const div = document.createElement("div");
    div.className = `ach-card ${isUnlocked ? "unlocked" : "locked"}`;
    div.innerHTML = `
      <div class="ach-icon">${ach.icon}</div>
      <div class="ach-info">
        <div class="ach-name">${ach.name}</div>
        <div class="ach-desc">${ach.desc}</div>
        ${!isUnlocked ? `<div class="ach-progress">${progress}</div>` : ""}
      </div>
      <div class="ach-badge ${isUnlocked ? "gold" : "locked"}">${isUnlocked ? "✓ DONE" : progress}</div>
    `;
    list.appendChild(div);
  });
}
